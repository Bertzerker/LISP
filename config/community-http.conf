# Machine bridge has no LAN listener. The signed body is checked again in PHP.
server {
    listen 127.0.0.1:8792;
    server_name localhost;
    access_log off;
    client_max_body_size 10m;
    location = /bridge {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/lisp-forum/lisp-bridge.php;
        fastcgi_param SCRIPT_NAME /lisp-bridge.php;
        fastcgi_pass unix:/run/lisp-forum/php.sock;
    }
    location / { return 404; }
}
