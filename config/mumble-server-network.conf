[Unit]
# Wants alone does not order Mumble after NetworkManager's online wait.
Wants=network-online.target
After=network-online.target
StartLimitIntervalSec=0

[Service]
# Online can mean the Wi-Fi is ready before the configured Ethernet address.
ExecStartPre=/usr/bin/python3 /opt/lisp-mumble/wait-mumble-address.py /etc/mumble/mumble-server.ini
TimeoutStartSec=100
RestartSec=10
