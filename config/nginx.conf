worker_processes auto;
pid /run/lan-party-nginx.pid;
error_log /var/log/nginx/lan-party-error.log;
events { worker_connections 1024; }
http {
    types_hash_max_size 4096;
    types_hash_bucket_size 128;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    log_format lisp '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/lan-party-access.log lisp;
    include /etc/nginx/lisp-community/http/*.conf;
    server {
        listen 80 default_server;
        server_name _;
        allow 127.0.0.1;
        allow 192.168.8.0/24;
        allow 10.42.0.0/24;
        deny all;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/lisp/tls/server.crt;
        ssl_certificate_key /etc/lisp/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        allow 127.0.0.1;
        allow 192.168.8.0/24;
        allow 10.42.0.0/24;
        deny all;
        root /srv/lan-party/site;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        auth_request /_lisp-session;
        include /etc/nginx/lisp-community/portal/*.conf;
        location = /_lisp-session {
            internal;
            auth_request off;
            proxy_pass http://127.0.0.1:8790/auth-api/check;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
        }
        location = /_lisp-admin {
            internal;
            auth_request off;
            proxy_pass http://127.0.0.1:8790/auth-api/check-admin;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
        }
        location @login { auth_request off; return 302 /login/; }
        location = / { auth_request off; return 302 /downloads/; }
        location = /index.html { auth_request off; return 302 /downloads/; }
        location = /login { auth_request off; return 302 /login/; }
        location /login/ { auth_request off; try_files $uri $uri/ =404; }
        location = /auth.js { auth_request off; }
        location = /home.js { auth_request off; return 410; }
        location = /login.js { auth_request off; }
        location = /account-controls.js { auth_request off; }
        location = /shell.js { auth_request off; }
        location = /personal-bar.js { auth_request off; }
        location = /portal.css { auth_request off; }
        location /style/ { auth_request off; try_files $uri =404; }
        location /auth-api/ {
            auth_request off;
            client_max_body_size 32k;
            proxy_pass http://127.0.0.1:8790;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
        }
        location /admin-api/ {
            auth_request /_lisp-admin;
            proxy_read_timeout 120s;
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:8788;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
        }
        location /api/chat {
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:8789;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
        }
        location /api/ {
            proxy_read_timeout 240s;
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:8787;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
        }
        location /accounts/ { auth_request /_lisp-admin; error_page 401 = @login; try_files $uri $uri/ =404; }
        location /admin/ { auth_request /_lisp-admin; error_page 401 = @login; try_files $uri $uri/ =404; }
        location / { error_page 401 = @login; try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
        location ~* \.(part|filepart|partial|tmp)$ { deny all; }
        location /files/ { alias /srv/lan-party/files/; autoindex off; disable_symlinks on; add_header Content-Disposition attachment; add_header X-Content-Type-Options nosniff; add_header Cache-Control "no-store"; }
    }
}
