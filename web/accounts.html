<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player accounts</title><link rel="icon" type="image/png" sizes="192x192" href="/style/android-chrome-192x192.png"><link rel="stylesheet" href="/portal.css?v=20261006-icons"></head><body>
<p class="eyebrow">ADMIN // LOCAL IDENTITIES</p><h1>Player accounts</h1><p>Create accounts, reset passwords and approve changed network interfaces.</p><p id="accounts-message" role="status"></p>
<form id="account-create" class="admin-form"><h2>Add an account</h2><label>Name<input name="name" pattern="[A-Za-z][A-Za-z0-9_-]{1,19}" maxlength="20" required></label><label>Temporary password<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Role<select name="role"><option value="player">Player</option><option value="admin">Administrator</option></select></label><label>Observed network interface<select name="ip" id="create-interface" required></select></label><button>Create account</button></form>
<div class="button-row"><button id="accounts-refresh" class="quiet">Refresh interfaces</button></div><h2>Accounts</h2><div id="account-list" class="account-list"></div>
<script src="/auth.js"></script><script src="/accounts.js"></script><script src="/shell.js?v=20261006-rooms"></script></body></html>
