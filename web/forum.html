<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local forum</title><link rel="icon" type="image/png" href="/style/Coat%20of%20Arms.png"><link rel="stylesheet" href="/portal.css?v=20261008-branding"></head><body>
<p class="eyebrow">FORUM // THE PARTY NOTICEBOARD</p><h1>Local forum</h1><p>Plan a game, share a tip, or ask the party for help.</p><p id="forum-message" role="status"></p><nav id="forum-boards" class="forum-tabs" aria-label="Forum sections"></nav>
<section id="forum-board"><h2 id="forum-heading"></h2><div id="forum-topics"></div><details><summary>Start a topic</summary><form id="forum-new" class="admin-form"><label>Title<input name="title" maxlength="120" required></label><label>Message<textarea name="body" maxlength="8000" rows="6" required></textarea></label><button>Post topic</button></form></details></section>
<section id="forum-topic" hidden><button id="forum-back" class="quiet">Back to topics</button><h2 id="topic-title"></h2><div id="forum-moderation" class="button-row" hidden><button id="topic-lock" class="quiet">Lock topic</button><button id="topic-delete" class="danger">Delete topic</button></div><div id="forum-posts"></div><form id="forum-reply" class="admin-form"><label>Your reply<textarea name="body" maxlength="8000" rows="5" required></textarea></label><button>Post reply</button></form></section>
<script src="/auth.js"></script><script src="/forum.js"></script><script src="/shell.js?v=20261008-branding"></script></body></html>
