location /community-api/ {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-LISP-Private "";
}
location /community-private/ { deny all; }
location /bracket-api/ {
    client_max_body_size 8m;
    proxy_read_timeout 40s;
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization "";
}
location /bracket/ {
    alias /opt/lisp-bracket/frontend/dist/;
    error_page 401 = @login;
    try_files $uri $uri/ /bracket/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
}
location /forum/ {
    alias /opt/lisp-forum/;
    index index.php;
    error_page 401 = @login;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ~ ^/forum/(Sources|Packages|cache|other|vendor|\.git)(/|$) { deny all; }
    location ~ /\. { deny all; }
    location ~ ^/forum/(?<smf_entry>index|proxy|subscriptions|cron)\.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/lisp-forum/$smf_entry.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/lisp-forum/php.sock;
        fastcgi_read_timeout 30s;
    }
    location ~* \.(php|phtml|phar|sql|md|json|lock|ini|yml|yaml|bak|log)$ { deny all; }
    location ~ ^/forum/(install|upgrade|SSI)(\.|/|$) { deny all; }
}

location /community-source/ {
    alias /srv/lan-party/community-source/;
    index index.html;
    error_page 401 = @login;
    add_header X-Content-Type-Options nosniff always;
}
